<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="gold-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C547"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="green-w" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a4a"/>
      <stop offset="100%" style="stop-color:#1a3d32"/>
    </linearGradient>
  </defs>
  <!-- Icon: circle with KG -->
  <circle cx="60" cy="60" r="52" fill="url(#green-w)"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#gold-w)" stroke-width="2.5"/>
  <!-- K + O-shaped G with leaf inside (centered) -->
  <!-- Custom K – clear K shape (stroke style like G), aligned with G -->
  <path d="M40 43 L40 57 M40 48 L52 43 M40 48 L52 57" fill="none" stroke="#F5F5DC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- G shape (O with flat bottom, cut on right) -->
  <path d="M65.2 43 A14 14 0 0 0 51.2 64 L65.2 64 L65.2 57" fill="none" stroke="#F5F5DC" stroke-width="2.5"/>
  <path d="M63 45 C60.5 47 59 50 59.5 53 C60 55 61.5 56.5 63 56.5 C64.5 56.5 66 55 66.5 53 C67 50 65.5 47 63 45 Z" fill="url(#gold-w)" opacity="0.95"/>
  <path d="M63 56.5 L63 59" stroke="url(#gold-w)" stroke-width="0.8" stroke-linecap="round" opacity="0.9"/>
  <!-- Company name -->
  <text x="130" y="52" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#green-w)">Kather Ghani</text>
  <text x="130" y="82" font-family="Georgia, serif" font-size="14" fill="#5a5a5a" letter-spacing="0.05em">Premium Oil</text>
</svg>
