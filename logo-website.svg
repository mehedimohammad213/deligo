  <path d="M63 40 C60.5 42 59 45 59.5 48 C60 50 61.5 51.5 63 51.5 C64.5 51.5 66 50 66.5 48 C67 45 65.5 42 63 40 Z" fill="url(#gold-w)" opacity="0.95"/>
