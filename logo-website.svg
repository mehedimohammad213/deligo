  <path d="M60 72 C52 78 48 86 50 92 C52 96 56 98 60 98 C64 98 68 96 70 92 C72 86 68 78 60 72 Z" fill="url(#gold-w)" opacity="0.95"/>
  <path d="M60 98 L60 102" stroke="url(#gold-w)" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <!-- Company name -->
  <text x="130" y="52" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="url(#green-w)">Kather Ghani</text>
  <text x="130" y="82" font-family="Georgia, serif" font-size="14" fill="#5a5a5a" letter-spacing="0.05em">Premium Oil</text>
