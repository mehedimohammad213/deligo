  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#gold-w)" stroke-width="2.5"/>
  <text x="60" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#F5F5DC">KG</text>
