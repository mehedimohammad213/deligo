<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C547"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a4a"/>
      <stop offset="100%" style="stop-color:#1a3d32"/>
    </linearGradient>
  </defs>
  <!-- No background, no border -->
  <!-- K + O-shaped G with leaf inside (centered) -->
  <!-- Custom K – clear K shape (stroke style like G), aligned with G -->
  <path d="M62 70 L62 96 M62 80 L90 70 M62 80 L90 96" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- G shape (O with flat bottom, cut on right) -->
  <path d="M120.6 62 A24 24 0 0 0 96.6 98 L120.6 98 L120.6 86" fill="none" stroke="#000000" stroke-width="4"/>
  <!-- Leaf inside the O -->
  <path d="M118 68 C114 71 112 76 113 80 C114 83 116 85 118 85 C120 85 122 83 123 80 C124 76 122 71 118 68 Z" fill="url(#gold)" opacity="0.95"/>
  <path d="M118 85 L118 88" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
</svg>
