<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C547"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a4a"/>
      <stop offset="100%" style="stop-color:#1a3d32"/>
    </linearGradient>
  </defs>
  <!-- Background circle - works on Facebook and dark sections -->
  <circle cx="100" cy="100" r="98" fill="url(#green)"/>
  <circle cx="100" cy="100" r="98" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- K + O-shaped G with leaf inside (centered) -->
  <!-- Custom K – clear K shape (stroke style like G), aligned with G -->
  <path d="M62 70 L62 96 M62 80 L90 70 M62 80 L90 96" fill="none" stroke="#F5F5DC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- G shape (O with flat bottom, cut on right) -->
  <path d="M120.6 70 A24 24 0 0 0 96.6 106 L120.6 106 L120.6 94" fill="none" stroke="#F5F5DC" stroke-width="4"/>
  <!-- Leaf inside the O -->
  <path d="M118 76 C114 79 112 84 113 88 C114 91 116 93 118 93 C120 93 122 91 123 88 C124 84 122 79 118 76 Z" fill="url(#gold)" opacity="0.95"/>
  <path d="M118 93 L118 96" stroke="url(#gold)" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
</svg>
